- role: Senior Software Engineer
  company: Wellhub
  period: Abr 2025 – Atualmente
  meta: Tempo integral, Remoto
  team: Wellbeing Access (Validação de Elegibilidade)
  bullets:
    - "**Engenharia de software com IA:** liderei a adoção nos projetos de frontend e apoiei os times de backend nos fluxos deles. Montei a camada de skills (convenções e fluxos do time transformados em skills reutilizáveis para os agentes), o harness (contexto, ferramentas, permissões e guardrails) e o ciclo de desenvolvimento."
    - "**Hefesto (agente de IA):** criei um agente que leva uma tarefa do Jira ou do GitHub Projects até um PR aberto, usando Spec-Driven Development (SDD): um plano validado por uma pessoa, um agente novo que o implementa com TDD em um git worktree isolado e um sensor que roda a aplicação (Playwright, curl) e devolve as falhas para o ciclo."
    - "**Observabilidade:** criei dashboards e alertas no Grafana (Prometheus, Loki) e no Datadog para latência, taxa de erro, logs, Core Web Vitals (LCP, TTFB, CLS), pods do Kubernetes (memória, réplicas, uso de CPU vs. requests), event loop e heap do Node.js, saúde do Kafka e integrações de terceiros, como o reCAPTCHA."
    - "**Cultura de dados:** levei uma cultura orientada a dados para o time, com rastreamento de eventos e analytics de produto. Liderei o time de frontend na criação de dashboards no Metabase para acompanhar experimentos A/B (Unleash, GrowthBook) e medir o impacto das funcionalidades."

