title: Hefesto, um agente de IA
intro: "O Hefesto leva uma tarefa do Jira ou do GitHub Projects até um pull request aberto. O ponto não é conectar um agente a um gerenciador de tarefas, e sim estruturar o fluxo para que a implementação feita pela IA possa ser verificada antes de chegar à revisão humana. Um PR aberto não significa que a mudança está correta."
steps:
  - title: Tarefa
    text: Uma tarefa do Jira ou do GitHub Projects é o ponto de partida.
  - title: Plano
    text: Um plano escrito com spec-driven development e validado por uma pessoa antes de existir qualquer código. Ele define o que significa "pronto" em critérios verificáveis.
  - title: Implementar
    text: Um agente novo constrói em cima do plano com TDD, em um git worktree isolado.
  - title: Verificar
    text: Um sensor roda a aplicação (Playwright, curl) e devolve as falhas para a implementação. O ciclo termina quando os critérios do plano são atendidos, e não quando o agente diz que terminou.
  - title: Pull request
    text: Um PR aberto com a mudança já verificada, pronto para revisão humana.
outro: "Os pontos de controle: uma pessoa valida o plano antes de qualquer código, o trabalho fica isolado, a aplicação em execução julga o resultado e uma pessoa revisa o PR. Os agentes aceleram o trabalho, mas quem responde pelo resultado são as pessoas."
