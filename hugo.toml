baseURL = "https://cmarcal.github.io/cmarcal-roberto.dev/"
title = "Roberto Marçal"
defaultContentLanguage = "en"

disableKinds = ["taxonomy", "term"]

[params]
  linkedin = "https://www.linkedin.com/in/roberto-cmarcal/"
  github = "https://github.com/cmarcal"
  email = "cmarcal.roberto@gmail.com"

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    [languages.en.params]
      description = "Frontend engineer with extensive experience building web applications, from architecture and design systems to performance and testing. Today building AI-first."
      role = "Frontend Engineer"
      location = "Brazil"
    [[languages.en.menus.main]]
      name = "Articles"
      url = "articles/"
      weight = 1
    [[languages.en.menus.main]]
      name = "Contact"
      url = "#contact"
      weight = 2

  [languages.pt-br]
    label = "Português (Brasil)"
    locale = "pt-BR"
    weight = 2
    [languages.pt-br.params]
      description = "Frontend Engineer com muita experiência criando aplicações web, da arquitetura e dos design systems à performance e aos testes. Hoje criando com a IA no centro do processo."
      role = "Frontend Engineer"
      location = "Brasil"
    [[languages.pt-br.menus.main]]
      name = "Artigos"
      url = "articles/"
      weight = 1
    [[languages.pt-br.menus.main]]
      name = "Contato"
      url = "#contact"
      weight = 2

[markup.goldmark.renderer]
  unsafe = true

[security]
  allowContent = ['.*']
