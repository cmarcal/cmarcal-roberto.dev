baseURL = "https://cmarcal.github.io/cmarcal-roberto.dev/"
title = "Roberto Marçal"
defaultContentLanguage = "en"

disableKinds = ["taxonomy", "term"]

[params]
  linkedin = "https://www.linkedin.com/in/roberto-cmarcal/"
  github = "https://github.com/cmarcal"
  email = "cmarcal.roberto@gmail.com"

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    [languages.en.params]
      description = "Frontend engineer building digital products at scale, with depth in architecture, performance and quality, and leading the adoption of AI in software development."
      role = "Frontend Engineer"
      location = "Brazil"
      rotating = ["Frontend architecture", "Design systems", "Web performance", "AI-driven workflows"]
    [[languages.en.menus.main]]
      name = "Articles"
      url = "articles/"
      weight = 1

  [languages.pt-br]
    label = "Português (Brasil)"
    locale = "pt-BR"
    weight = 2
    [languages.pt-br.params]
      description = "Frontend Engineer na construção de produtos digitais em escala, com profundidade em arquitetura, performance e qualidade, e liderando a adoção de IA no desenvolvimento de software."
      role = "Frontend Engineer"
      location = "Brasil"
      rotating = ["arquitetura de frontend", "design systems", "performance web", "fluxos com IA"]
    [[languages.pt-br.menus.main]]
      name = "Artigos"
      url = "articles/"
      weight = 1

[markup.goldmark.renderer]
  unsafe = true

[security]
  allowContent = ['.*']
