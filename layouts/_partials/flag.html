{{ if eq . "pt-br" }}
<svg viewBox="0 0 24 16" width="24" height="16" aria-hidden="true" focusable="false"><rect width="24" height="16" fill="#009c3b"/><path d="M12 2.2 21.4 8 12 13.8 2.6 8Z" fill="#ffdf00"/><circle cx="12" cy="8" r="3.4" fill="#002776"/><path d="M8.7 7.3q3.3-1 6.7 1.2" stroke="#fff" stroke-width=".7" fill="none"/></svg>
{{ else }}
<svg viewBox="0 0 24 16" width="24" height="16" aria-hidden="true" focusable="false"><rect width="24" height="16" fill="#fff"/>{{ range $i := seq 0 6 }}<rect y="{{ printf "%.2f" (mul $i 2.4615) }}" width="24" height="1.2308" fill="#b22234"/>{{ end }}<rect width="9.6" height="8.615" fill="#3c3b6e"/>{{ range $y := slice 1.4 3.3 5.2 7.1 }}{{ range $x := slice 1.2 3 4.8 6.6 8.4 }}<circle cx="{{ $x }}" cy="{{ $y }}" r=".38" fill="#fff"/>{{ end }}{{ end }}</svg>
{{ end }}
