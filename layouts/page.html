{{ define "main" }}
<article class="article">
  <header>
    <h1>{{ .Title }}</h1>
    {{ if .Date }}{{ if eq .Section "articles" }}
    <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time> · {{ .ReadingTime }} min read
      {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}</p>
    {{ end }}{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
  {{ if eq .Section "articles" }}<p><a href="{{ "articles/" | relURL }}">← All articles</a></p>{{ end }}
</article>
{{ end }}
